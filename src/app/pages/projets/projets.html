<div class="projets-container">
  <div class="projets-carousel-wrapper">
    <swiper-container navigation="true" pagination="true" space-between="30" 
                      slides-per-view="1" 
                      breakpoints='{"768": {"slidesPerView": 2}, "1024": {"slidesPerView": 3}}'>
      <swiper-slide *ngFor="let projet of allProjets">
        <div class="projet-card" (click)="openModal(projet)">
          <div class="card-image-area">
            <img [src]="projet.image_url" class="projet-thumbnail">
            <span class="card-type-tag">{{projet.type}}</span>
          </div>
          <div class="card-content">
            <h3 class="card-title">{{projet.titre}}</h3>
            <p class="card-summary">{{projet.description_sommaire}}</p>
          </div>
        </div>
      </swiper-slide>
    </swiper-container>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal && selectedProjet" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="modal-close-btn" (click)="closeModal()">×</button>
    
    <h2 class="modal-title">{{selectedProjet.titre}}</h2>
    <span class="modal-subtitle">{{selectedProjet.type}}</span>

    <div class="modal-carousel-container">
      <iframe *ngIf="selectedProjet.youtube_url"
              class="carousel-main-image"
              [src]="getSafeYoutubeUrl(selectedProjet.youtube_url)"
              frameborder="0" allowfullscreen>
      </iframe>

      <ng-container *ngIf="!selectedProjet.youtube_url">
        <img [src]="selectedProjet.carousel_images && selectedProjet.carousel_images.length > 0 ? selectedProjet.carousel_images[currentImageIndex] : selectedProjet.image_url" 
             class="carousel-main-image">

        <div class="carousel-thumbnails" *ngIf="selectedProjet.carousel_images && selectedProjet.carousel_images.length > 1">
          <img *ngFor="let img of selectedProjet.carousel_images; let i = index"
               [src]="img"
               class="carousel-thumbnail-item"
               [class.active-thumbnail]="i === currentImageIndex"
               (click)="setMainImage(i)">
        </div>
      </ng-container>
    </div>

    <div class="modal-details-grid">
      <div class="detail-block">
        <span class="detail-label">Contexte</span>
        <span class="detail-value">{{selectedProjet.contexte}}</span>
      </div>
      <div class="detail-block">
        <span class="detail-label">Durée</span>
        <span class="detail-value">{{selectedProjet.duree}}</span>
      </div>
      <div class="detail-block">
        <span class="detail-label">Technologies</span>
        <span class="detail-value">{{selectedProjet.technologies.join(', ')}}</span>
      </div>
    </div>

    <div class="modal-description">
      <p>{{selectedProjet.description_complete}}</p>
    </div>
  </div>
</div>
